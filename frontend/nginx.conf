
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://carservice.railway.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Giữ nguyên X-Forwarded-For do edge Railway gắn (IP người dùng ở cuối). Không nối thêm IP edge:
        # Laravel chỉ tin máy gọi trực tiếp (nginx này), nên phần tử cuối phải là IP người dùng.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /sanctum/ {
        proxy_pass http://carservice.railway.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}