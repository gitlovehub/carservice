<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarService - Dịch vụ chăm sóc và sửa chữa xe</title>
    <!-- Gắn theme trước khi vẽ để không nháy sáng/tối. Cùng khoá với src/contexts/ThemeContext.tsx. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("carservice-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (error) { /* Trình duyệt chặn storage: dùng mặc định. */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        // Gắn khu khách trước khi vẽ để không nháy font. Cùng quy tắc với ClientFontScope trong src/App.tsx.
        if (!/^\/(admin|advisor)(\/|$)/.test(location.pathname)) document.documentElement.dataset.client = "customer";
      })();
    </script>
    <!-- Google Sans cho toàn bộ giao diện, Roboto Condensed cho mã phiếu và biển số. Cả hai có đủ dấu tiếng Việt. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Itim: font riêng của khu khách hàng (html[data-client="customer"]). -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
